# Kingfisher als Container. `make start` baut aus dieser Arbeitskopie; `make aktualisieren` setzt KINGFISHER_IMAGE in
# .kingfisher.env auf ein fertiges Bild (ghcr.io/icarus-health/kingfisher-app:<fassung>), dann wird nichts gebaut.
#
# deploy/compose.app.yaml ist dieselbe Konfiguration ohne `build:` für die Mac-App. Projektname, Datenvolume und Port
# dürfen sich nie ändern, sonst findet eine bestehende Installation ihre Daten nicht mehr
# (sidecar/tests/test_compose_vertrag.py).
name: kingfisher

services:
  kingfisher:
    build: .
    image: ${KINGFISHER_IMAGE:-kingfisher:local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8890:8890"
    environment:
      - ICARUS_SIDECAR_TOKEN=${ICARUS_SIDECAR_TOKEN:?bitte setzen}
      - ICARUS_SECRETS_PASSPHRASE=${ICARUS_SECRETS_PASSPHRASE:?bitte setzen}
      - KINGFISHER_USER_NAME=${KINGFISHER_USER_NAME:-}
      - KINGFISHER_FIXTURE=${KINGFISHER_FIXTURE:-}
      - KINGFISHER_WEATHER_ENABLED=${KINGFISHER_WEATHER_ENABLED:-false}
      - KINGFISHER_WEATHER_LOCATION=${KINGFISHER_WEATHER_LOCATION:-}
      # Zeitzone für Zeitangaben in Antworten; der Container selbst läuft in UTC.
      - KINGFISHER_TIMEZONE=${KINGFISHER_TIMEZONE:-Europe/Berlin}
      - KINGFISHER_WEATHER_LATITUDE=${KINGFISHER_WEATHER_LATITUDE:-}
      - KINGFISHER_WEATHER_LONGITUDE=${KINGFISHER_WEATHER_LONGITUDE:-}
      - ICARUS_PROVIDER=${ICARUS_PROVIDER:-}
      - ICARUS_MODEL=${ICARUS_MODEL:-}
      - ICARUS_BASE_URL=${ICARUS_BASE_URL:-}
      - ICARUS_TRUSTED_LOCAL_MODEL_HOSTS=${ICARUS_TRUSTED_LOCAL_MODEL_HOSTS:-host.docker.internal}
      # Bedeutungssuche mit lokalem bge-m3; leer = aus. Siehe docs/evaluations/memory-quality/paraphrase.
      - ICARUS_MEMORY_SEMANTIC=${ICARUS_MEMORY_SEMANTIC:-}
      # Dauerhafte Arbeitsgedächtnissuche getrennt von alten Diagnose-/Wissenspfaden aktivieren.
      - KINGFISHER_DURABLE_MEMORY_SEARCH=${KINGFISHER_DURABLE_MEMORY_SEARCH:-${ICARUS_MEMORY_SEMANTIC:-}}
      - LLM_API_KEY=${LLM_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - kingfisher-data:/data

volumes:
  kingfisher-data:

