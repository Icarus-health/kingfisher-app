# Mac-App (Kingfisher.dmg): universell übersetzt, ad hoc signiert, nicht notarisiert.
#
# - Aus dem Release-Workflow (`workflow_call` mit `fassung`): DMG bauen und als Artefakt `Kingfisher.dmg` hochladen.
# - Bei Pull Requests, die macos/ oder diesen Workflow ändern: nur übersetzen, Logik prüfen und das DMG bauen,
#   damit die macOS-Minuten sparsam bleiben. Hochgeladen wird dann nichts.

name: Mac-App

on:
  workflow_call:
    inputs:
      fassung:
        description: "Fassung nach SemVer, etwa 1.0.1 (Tag des Bildes und Fassung der App)"
        required: true
        type: string
  pull_request:
    paths:
      - "macos/**"
      - "scripts/kingfisher_update_storage.py"
      - "scripts/harness_*.mjs"
      - "scripts/harness_gateway.py"
      - "integrations/harness/package*.json"
      - "deploy/compose.modules.yaml"
      - ".github/workflows/mac-app.yml"

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Logik prüfen
        run: |
          xcrun swiftc macos/App/Logic/*.swift macos/Shared/PowerReporter.swift macos/Shared/Mitteilungen.swift macos/tests/main.swift -o "$RUNNER_TEMP/kingfisher-logic"
          "$RUNNER_TEMP/kingfisher-logic"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hauptdienst, lokale Module und sichere Updates prüfen
        run: |
          python -m pip install pytest
          python -m pytest macos/test_main_service.py macos/test_update_storage.py macos/test_module_setup_request.py macos/test_module_runtime_cache.py macos/test_module_runtime_manager.py macos/test_draft_leave.py macos/test_recovery_native_ui.py -q

      - name: Fenster des Bestands übersetzen
        # Teilt Shared/ mit der App; so fällt ein Bruch dort auch hier auf.
        run: |
          xcrun swiftc -parse-as-library -typecheck -target arm64-apple-macosx11.3 \
            macos/Shared/*.swift macos/KingfisherApp.swift

      - name: DMG bauen
        env:
          # Leer bei Pull Requests: dann gilt die Datei VERSION.
          KINGFISHER_FASSUNG: ${{ inputs.fassung }}
        run: bash macos/build_dmg.sh

      - name: Artefakt hochladen
        if: inputs.fassung != ''
        uses: actions/upload-artifact@v4
        with:
          name: Kingfisher.dmg
          path: dist/Kingfisher.dmg
          if-no-files-found: error
